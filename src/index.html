<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Tom chrome</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chrome-ui.css"></head>
<body>
<header id="chrome">
  <div class="tabstrip"><div class="traffic-space"></div><div id="tabs" role="tablist" aria-label="标签页"></div><button id="new-tab" class="icon-button" title="新标签页 (⌘T)" aria-label="新标签页"></button><div class="drag-space"></div><button id="tab-search" class="icon-button" title="搜索标签页" aria-label="搜索标签页"></button></div>
  <div class="toolbar"><button id="back" class="icon-button" title="后退 (⌘[)" aria-label="后退"></button><button id="forward" class="icon-button" title="前进 (⌘])" aria-label="前进"></button><button id="reload" class="icon-button" title="重新加载 (⌘R)" aria-label="重新加载"></button>
    <div id="omnibox"><button id="site-info" class="icon-button" title="网站信息" aria-label="网站信息"></button><input id="address" autocomplete="off" spellcheck="false" aria-label="地址栏" placeholder="搜索或输入网址"><span id="zoom-label"></span><button id="blocked-popups" class="icon-button" aria-label="已拦截的弹窗" hidden></button><button id="bookmark" class="icon-button" title="为此标签页添加书签 (⌘D)" aria-label="添加书签"></button></div>
    <button id="downloads" class="icon-button" title="下载内容" aria-label="下载内容"></button><button id="privacy-button" class="icon-button" title="隐私与安全" aria-label="隐私与安全"></button><span id="tor-badge" hidden>Tor</span><button id="menu-button" class="icon-button" title="自定义及控制 Tom chrome" aria-label="菜单"></button>
  </div>
  <div id="bookmarks-bar"></div>
  <div id="findbar" hidden><input id="find-input" placeholder="在网页中查找" aria-label="查找内容"><span id="find-count"></span><button id="find-prev" class="icon-button" aria-label="上一个匹配"></button><button id="find-next" class="icon-button" aria-label="下一个匹配"></button><button id="find-close" class="icon-button" aria-label="关闭查找"></button></div>
</header>
<div id="fullscreen-notice" hidden><span id="fullscreen-origin"></span><span>已进入全屏 · 按 Esc 退出</span><button class="text-button" data-action="exit-html-fullscreen">退出全屏</button></div>
<main id="content"></main>
<div id="overlay" hidden><div id="popup" role="dialog"></div></div>
<div id="toast" role="status"></div>
<script src="renderer.js"></script>
</body></html>
